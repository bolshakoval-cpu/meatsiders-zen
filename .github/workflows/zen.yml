name: Zen RSS

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zen-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install beautifulsoup4 lxml pillow
      - name: Build zen.xml
        run: python tilda2zen.py --drip --seed tilda_feed.csv --rss https://meatsiders.ru/rss-feed-814038631341.xml --state published.json -o zen.xml --check-images
      - name: Commit if changed
        run: git add zen.xml published.json && (git diff --cached --quiet || (git config user.name "zen-bot" && git config user.email "zen-bot@users.noreply.github.com" && git commit -m "update zen feed" && git push))
